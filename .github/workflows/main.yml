name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Plugins
        run: |
          npm install
          npm install @capacitor/android @capacitor/assets @capacitor/push-notifications @capacitor-mlkit/barcode-scanning @capacitor/local-notifications

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix minSdkVersion for Android
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' android/build.gradle
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dukani-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
